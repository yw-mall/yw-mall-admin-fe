server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Use Podman's embedded DNS (10.89.0.1) so the upstream hostname is
    # re-resolved every 30 s. Without `resolver` + a variable in `proxy_pass`,
    # nginx caches the IP at startup and serves 502 forever after a backend
    # container is force-recreated and gets a new IP.
    resolver 10.89.0.1 valid=30s ipv6=off;

    # Proxy merchant API calls to apisix → mall-admin-api.
    # merchant-fe 的 axios baseURL 是 /merchant/v1，apisix route
    # 已配 /merchant/* → mall-admin-api:18999，整段透传。
    location /merchant/ {
        # ---- Trace propagation ----
        # 浏览器不主动发 traceparent / X-Request-Id；这里统一覆盖：上游 APISIX
        # → mall-admin-api 拿到一致的 trace_id 写入日志。F12 看 response 头里
        # 的 X-Request-Id 提工单即可关联整链路。
        set $upstream_api "apisix:9080";
        proxy_pass         http://$upstream_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-Id      $request_id;

        # 响应回写给浏览器，F12 看 response 头能拿 request_id。
        add_header X-Request-Id  $request_id always;
    }

    # SPA fallback — all unmatched routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
